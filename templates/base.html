    <style>
      /* WhatsApp-like density: compact controls, rows, and type without changing the brand. */
      body{font-size:14px}
      .topbar{height:56px;padding:0 18px;gap:12px}
      .topbar a,.topbar button{padding:7px 8px;font-size:13px}
      .brand{gap:8px;font-size:14px}
      .brand-mark{width:30px;height:30px}
      .sidebar{width:350px;min-width:280px}
      .side-head{padding:17px 18px 11px}
      .side-head h1{font-size:19px}
      .search{margin:2px 13px 11px;padding:8px 11px;border-radius:9px}
      .contact{gap:10px;padding:10px 15px}
      .contact-name{font-size:14px}
      .avatar{font-size:12px}
      .page{height:calc(100dvh - 56px);max-width:820px;padding:28px 20px 62px}
      .page h1{font-size:24px}
      .page-sub{margin-bottom:20px;font-size:13px}
      .card{border-radius:12px;padding:16px;margin:10px 0}
      .grid{gap:10px}
      .btn{padding:9px 13px;font-size:13px;border-radius:8px}
      .icon-btn svg,.side-action svg{width:18px;height:18px}
      .thread-head{height:58px;padding:8px 16px;gap:9px}
      .messages{padding:17px clamp(12px,7vw,80px)}
      .bubble{padding:7px 9px;font-size:14px}
      .composer{padding:8px 14px calc(8px + env(safe-area-inset-bottom));gap:6px}
      .composer textarea{min-height:38px;padding:8px 13px}
      .composer .icon-btn,.send{height:38px;width:38px}
      .mobile-nav{height:58px}
      .mobile-nav-item{font-size:17px}
      .mobile-nav-item small{font-size:9px}
      .page-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
      .compact-btn{white-space:nowrap;margin-top:2px}
      .discover-grid{grid-template-columns:repeat(auto-fit,minmax(275px,1fr))}
      .discover-card{display:flex;flex-direction:column;align-items:stretch;gap:13px}
      .discover-identity{display:flex;align-items:center;gap:11px}
      .discover-identity .avatar{width:52px!important;height:52px!important;font-size:14px}
      .discover-name{font-size:15px;font-weight:700}
      .discover-handle{font-size:12px;color:var(--muted);margin-top:2px}
      .discover-details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
      .profile-detail{background:var(--panel2);border-radius:8px;padding:8px 9px;min-width:0}
      .profile-detail small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
      .profile-detail span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
      .discover-actions{display:flex;gap:7px}
      .discover-actions .btn{flex:1;text-align:center}
      .btn.call-outline{background:transparent;color:var(--accent2);border:1px solid var(--line);box-shadow:none}
      .call-page{height:calc(100dvh - 56px);display:grid;place-items:center;padding:20px 16px 58px;overflow:auto}
      .call-card{width:min(100%,440px);background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px}
      .call-topline{display:flex;align-items:center;gap:12px;color:var(--muted);font-weight:700;padding:0 4px}
      .call-back{font-size:27px;line-height:1;color:var(--text)}
      .call-stage{position:relative;min-height:330px;display:grid;place-items:center;align-content:center;text-align:center;padding:30px 18px 20px}
      .call-avatar{width:104px;height:104px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#16070c;font-size:28px;font-weight:800;margin-bottom:15px;overflow:hidden}
      .call-avatar img{width:100%;height:100%;object-fit:cover}
      .call-stage h1{font-size:21px;margin:0 0 6px;max-width:100%;overflow:hidden;text-overflow:ellipsis}
      .call-status{color:var(--muted);font-size:13px;margin:0}
      .remote-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#080708;border-radius:10px}
      .local-video{position:absolute;right:14px;top:14px;width:100px;height:140px;object-fit:cover;background:#111;border:2px solid var(--panel);border-radius:9px;z-index:1}
      .local-audio{display:none}
      .call-dialer{padding:0 6px 10px}
      .call-search{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;color:var(--muted)}
      .call-search input{width:100%;background:transparent;border:0;outline:0;color:var(--text);font-size:13px}
      .call-modes{display:flex;gap:6px;margin-top:9px}
      .call-modes .pill{padding:6px 10px;font-size:12px;cursor:pointer}
      .call-actions{display:flex;justify-content:center;align-items:center;gap:16px;padding:10px 0 4px}
      .call-action{width:48px;height:48px;border:0;border-radius:50%;font-size:18px;display:grid;place-items:center;transition:transform .15s,filter .15s}
      .call-action:hover{transform:translateY(-1px);filter:brightness(1.08)}
      .call-action svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
      .call-action-primary{background:#00a884;color:#fff;box-shadow:0 7px 18px #00a88433}
      .call-action-danger{background:#e53950;color:#fff;box-shadow:0 7px 18px #e5395033}
      .call-action-muted{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
      .call-action-muted.is-muted{background:var(--accent);color:#fff;border-color:var(--accent)}
      .incoming-actions{display:flex;gap:8px;padding:8px 4px 4px}
      .incoming-actions .btn{flex:1}
      .call-error{text-align:center;margin-top:8px}
      .more-toggle{font-size:22px!important;line-height:1;margin-left:2px}
      .more-menu{position:absolute;right:12px;top:49px;display:none;min-width:150px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:5px;box-shadow:var(--shadow);z-index:30}
      .more-menu.open{display:grid}
      .more-menu a{padding:8px 10px!important;color:var(--text)!important;font-size:13px!important;border-radius:6px}
      .more-menu a:hover{background:var(--panel2)}
      .topbar{position:relative}
      .send:disabled{opacity:.6;cursor:wait}
      .call-page{grid-template-columns:minmax(0,440px);align-content:center;gap:12px}
      .call-history-card{width:min(100%,440px);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
      .section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
      .section-title h2{font-size:15px;margin:0}
      .section-title .muted{font-size:11px}
      .call-history-row{display:flex;align-items:center;gap:10px;padding:9px 2px;border-top:1px solid var(--line)}
      .call-history-row:first-child{border-top:0}
      .call-history-info{min-width:0;flex:1}
      .call-history-info strong,.call-history-info span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .call-history-info strong{font-size:13px}
      .call-history-info span,.call-history-row time{font-size:11px;color:var(--muted)}
      .call-history-row.missed .call-history-info span{color:var(--accent2)}
      .stories-page{max-width:760px}
      .story-composer{padding:15px}
      .story-type-tabs{display:flex;gap:6px;margin-bottom:11px}
      .story-type-tabs .pill{padding:6px 10px;font-size:12px;cursor:pointer}
      .story-textarea{display:block;width:100%;min-height:92px;resize:vertical;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px;color:var(--text);outline:0;font-size:14px}
      .story-textarea:focus,.story-caption:focus,.story-privacy input:focus,.story-privacy select:focus{border-color:var(--accent)}
      .story-caption,.story-privacy input,.story-privacy select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--text);outline:0;font-size:12px}
      .story-caption{margin-top:8px}
      .story-file-row,.story-audio-row{display:flex;align-items:center;gap:9px;margin:9px 0;background:var(--panel2);border-radius:8px;padding:7px 9px;color:var(--muted);font-size:12px}
      .story-file-row span,.story-audio-row span{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
      .story-audio{display:flex;align-items:center;gap:8px;background:var(--panel2);padding:9px;border-radius:8px}
      .story-audio audio{height:30px;max-width:100%}
      .story-privacy{display:flex;align-items:center;gap:9px;margin-top:8px}
      .story-privacy label{width:145px;flex:none;font-size:11px;color:var(--muted)}
      .story-privacy .muted{font-size:10px}
      .stories-feed{margin-top:18px}
      .story-card{padding:14px}
      .story-head{display:flex;align-items:center;gap:9px;margin-bottom:10px}
      .story-head strong,.story-head small{display:block}
      .story-head strong{font-size:13px}
      .story-head small{font-size:11px;color:var(--muted);margin-top:2px}
      .story-media{display:block;width:100%;max-height:420px;object-fit:cover;border-radius:9px;background:#050505}
      .story-text{white-space:pre-wrap;word-break:break-word;font-size:17px;line-height:1.45;background:linear-gradient(135deg,#4b172a,#191117);border-radius:9px;padding:22px 18px;min-height:100px}
      .story-caption{font-size:12px;margin:9px 0 0;color:var(--muted);white-space:pre-wrap}
      .story-footer{display:flex;gap:5px;justify-content:flex-end;margin-top:10px}
      .story-action{background:transparent;border:0;color:var(--accent2);font-size:11px;padding:5px 7px;border-radius:6px}
      .story-action:hover{background:var(--panel2)}
      .story-action.danger{color:var(--accent)}
      .story-action.reaction.active{background:var(--panel2);color:var(--accent);font-weight:800}
      .story-action.reaction.active.dislike{color:#9b6bd7}
      .story-origin{display:block;color:var(--muted);font-size:11px;margin-top:8px}
      .story-viewers{display:flex;flex-wrap:wrap;align-items:center;gap:7px;padding:9px 0 0;border-top:1px solid var(--line);margin-top:8px;color:var(--muted);font-size:11px}
      .story-viewers strong{width:100%;color:var(--text);font-size:11px}
      .story-viewers span{display:inline-flex;align-items:center;gap:4px;background:var(--panel2);border-radius:16px;padding:3px 7px 3px 3px}
      .story-viewers .avatar{font-size:9px}
      @media(max-width:760px){
        .topbar{height:54px;padding:0 10px}
        .shell{height:calc(100dvh - 54px);padding-bottom:58px}
        .page{height:calc(100dvh - 54px);padding:22px 14px 64px}
        .page-heading{display:block}
        .compact-btn{display:inline-block;margin:2px 0 14px}
        .thread-head{height:56px;padding:7px 8px}
        .messages{padding:12px 9px}
        .composer{padding-left:7px;padding-right:7px}
        .call-page{height:calc(100dvh - 54px);padding:10px 9px 62px;place-items:start center}
        .call-card{margin-top:4vh}
        .call-stage{min-height:285px}
        .discover-grid{grid-template-columns:1fr}
        .call-page{grid-template-columns:minmax(0,440px);align-content:start}
        .call-history-card{margin-bottom:8px}
        .story-privacy{display:block}
        .story-privacy label{display:block;width:auto;margin-bottom:4px}
      }
    </style>
  {% block head %}{% endblock %}
</head>
<body data-theme="dark">
{% block body %}{% endblock %}
<script src="{{ url_for('static', filename='chatly.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
